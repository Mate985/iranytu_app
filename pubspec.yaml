name: first_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4
  path: ^1.9.1
  provider: ^6.1.5+1
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/tasks/
    - assets/audio/aac/
    - assets/audio/feedback/
    - assets/audio/words/
    - assets/audio/routines/